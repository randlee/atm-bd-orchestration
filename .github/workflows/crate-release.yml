name: Publish atm-bd-types

on:
  workflow_dispatch:
    inputs:
      version:
        description: Independent atm-bd-types version
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: atm-bd-types-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: ubuntu-24.04-arm
          - os: macos-15
          - os: macos-15-intel
          - os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - name: Check version and test crate
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python -c 'import os,tomllib; p=tomllib.load(open("crates/atm-bd-types/Cargo.toml","rb")); assert p["package"]["version"] == os.environ["RELEASE_VERSION"]'
          cargo test -p atm-bd-types --features python
      - name: Generate type stubs
        working-directory: crates/atm-bd-types
        run: cargo run --features python --bin stub_gen
      - name: Build abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --manifest-path crates/atm-bd-types/Cargo.toml --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error

  crate:
    needs: wheels
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate version and publish crate
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          python3 -c 'import os,tomllib; p=tomllib.load(open("crates/atm-bd-types/Cargo.toml","rb")); assert p["package"]["version"] == os.environ["RELEASE_VERSION"]'
          cargo publish -p atm-bd-types --locked

  pypi:
    needs: [wheels, crate]
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Upload wheels to PyPI
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install 'maturin>=1.9,<2'
          maturin upload --non-interactive dist/*.whl
