name: Publish atm-bd-types

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_ref:
        description: Immutable skill release ref containing the version source
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: atm-bd-types-release-${{ inputs.release_ref || github.sha }}
  cancel-in-progress: false

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: ubuntu-24.04-arm
          - os: macos-15
          - os: macos-15-intel
          - os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - name: Check version and test crate
        shell: bash
        run: |
          python -c 'import tomllib; v=tomllib.load(open("release-version.toml","rb"))["project"]["version"]; c=tomllib.load(open("crates/atm-bd-types/Cargo.toml","rb")); w=tomllib.load(open("crates/atm-bd-types/pyproject.toml","rb")); p=tomllib.load(open("apps/atm-bd-console/pyproject.toml","rb")); assert c["package"]["version"] == w["project"]["version"] == v and f"atm-bd-types=={v}" in p["project"]["dependencies"]'
          cargo test -p atm-bd-types --features python
      - name: Generate type stubs
        working-directory: crates/atm-bd-types
        run: cargo run --features python --bin stub_gen
      - name: Build abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --manifest-path crates/atm-bd-types/Cargo.toml --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error

  crate:
    needs: wheels
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate version and publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; v=tomllib.load(open("release-version.toml","rb"))["project"]["version"]; p=tomllib.load(open("crates/atm-bd-types/Cargo.toml","rb")); assert p["package"]["version"] == v; print(v)')"
          status="$(curl --silent --show-error --location --user-agent 'atm-bd-release (https://github.com/randlee/atm-bd-orchestration)' --output "$RUNNER_TEMP/crate.json" --write-out '%{http_code}' "https://crates.io/api/v1/crates/atm-bd-types/$version")"
          case "$status" in
            200) python3 -c 'import json,os; v=json.load(open(os.environ["RUNNER_TEMP"]+"/crate.json"))["version"]; assert not v["yanked"], "published crate version is yanked"' ;;
            404) cargo publish -p atm-bd-types --locked ;;
            *) echo "crates.io lookup failed: HTTP $status" >&2; exit 1 ;;
          esac

  pypi:
    needs: [wheels, crate]
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Upload wheels to PyPI
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install 'maturin>=1.9,<2'
          maturin upload --non-interactive --skip-existing dist/*.whl
