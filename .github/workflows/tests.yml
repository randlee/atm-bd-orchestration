name: tests

on:
  # A stacked PR branch runs once, under pull_request. Pushes run only on the
  # long-lived branches, so a force-pushed layer does not queue the matrix twice.
  push:
    branches: [develop, main, 'integrate/**']
  pull_request:

permissions:
  contents: read

# A newer push to the same PR supersedes its older run; pushes to the long-lived
# branches always run to completion.
concurrency:
  group: tests-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  console-tests:
    name: console (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SC_COMPOSE_VERSION: "1.8.0"
      SC_COMPOSE_SHA256: a12a16259c1cab58c4c611320653e442fe3440c2a15cce0ba617ad77d145809a
      UV_TOOL_DIR: ${{ github.workspace }}/../console-tools
      UV_TOOL_BIN_DIR: ${{ github.workspace }}/../console-bin
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]   # the host python the installer requires (sc-compose 1.8.0 ships cp39-abi3 wheels)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the console build hook embeds rev-list count + sha and refuses shallow checkouts
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
      - name: Install sc-compose ${{ env.SC_COMPOSE_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          asset="sc-compose_${SC_COMPOSE_VERSION}_x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$asset" \
            "https://github.com/randlee/sc-compose/releases/download/v${SC_COMPOSE_VERSION}/$asset"
          echo "${SC_COMPOSE_SHA256}  $RUNNER_TEMP/$asset" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/sc-compose"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/sc-compose"
          bin="$(find "$RUNNER_TEMP/sc-compose" -type f -name sc-compose | head -n 1)"
          test -n "$bin"
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$bin" "$HOME/.local/bin/sc-compose"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install console in isolation
        run: uv tool install --python '${{ steps.python.outputs.python-path }}' ./apps/atm-bd-console
      - name: Console tests
        working-directory: apps/atm-bd-console
        run: uv run --frozen --python '${{ steps.python.outputs.python-path }}' pytest -q
      - name: Repository Python type check
        run: uv run --frozen --python '${{ steps.python.outputs.python-path }}' --project apps/atm-bd-console pyright
      - name: Release tooling tests (no publication)
        run: uv run --frozen --python '${{ steps.python.outputs.python-path }}' --project apps/atm-bd-console pytest -q .github/scripts/tests
      - name: Build distributions and check publisher compatibility
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen --python '${{ steps.python.outputs.python-path }}' --with build==1.3.0 --project apps/atm-bd-console python -m build --wheel --sdist --outdir "$RUNNER_TEMP/twine-dist" apps/atm-bd-console
          uv run --frozen --python '${{ steps.python.outputs.python-path }}' --with twine==6.1.0 --project apps/atm-bd-console python -m twine check "$RUNNER_TEMP"/twine-dist/*.whl "$RUNNER_TEMP"/twine-dist/*.tar.gz
      - name: Built wheel installs from PyPI alone
        # The repo's uv path sources hide dependencies that are not on PyPI (0.19.13 required atm-bd-core).
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          uv venv --python '${{ steps.python.outputs.python-path }}' pypi-only
          uv pip install --no-config --python pypi-only --dry-run "$RUNNER_TEMP"/twine-dist/*.whl
      - name: Console CLI smoke tests
        working-directory: apps/atm-bd-console
        env:
          ATM_BD_CONSOLE_BIN: ${{ env.UV_TOOL_BIN_DIR }}/atm-bd
        run: |
          "$ATM_BD_CONSOLE_BIN" --help
          uv run --frozen --python '${{ steps.python.outputs.python-path }}' pytest -q tests/test_cli.py::test_installed_cron_command_runs_one_headless_tick

  package-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            sha256: a12a16259c1cab58c4c611320653e442fe3440c2a15cce0ba617ad77d145809a
          - os: macos-latest
            target: aarch64-apple-darwin
            sha256: c7b03453d357f36997b27467b02cfe6124713ca1ee9344175c31f8e0dc5f5408
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      SC_COMPOSE_VERSION: "1.8.0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # test_real_upgrade_from_a_0_2_3_install installs 0.2.3 from history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # the host python the installer requires

      - uses: astral-sh/setup-uv@v5

      - uses: extractions/setup-just@v2
        with:
          just-version: "1.40.0"
      - name: Warm the Python 3.11 script environment
        run: just warm-py311

      # The scripts render with the sc-compose wheel; it is the same version as the CLI below
      # (the newest release, the version `uv run --script` resolves for the `sc-compose >=` range in plugins/atm-bd-orchestration/manifest.yaml).
      - name: Install Python test dependencies
        run: python3 -m pip install pytest pydantic pyyaml "sc-compose==${SC_COMPOSE_VERSION}" "sc-sha>=1.7.0,<2"

      # Same pinned release asset and checksum as atm-core's tools/bootstrap.toml.
      - name: Install sc-compose ${{ env.SC_COMPOSE_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          asset="sc-compose_${SC_COMPOSE_VERSION}_${{ matrix.target }}.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$asset" \
            "https://github.com/randlee/sc-compose/releases/download/v${SC_COMPOSE_VERSION}/$asset"
          echo "${{ matrix.sha256 }}  $RUNNER_TEMP/$asset" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/sc-compose"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/sc-compose"
          bin="$(find "$RUNNER_TEMP/sc-compose" -type f -name sc-compose | head -n 1)"
          test -n "$bin"
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$bin" "$HOME/.local/bin/sc-compose"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Tool versions
        run: |
          sc-compose --version
          python3 -m pip show sc-compose | grep '^Version'
          jq --version
          python3 --version
          git --version

      - name: Generated blocks are current
        working-directory: plugins/atm-bd-orchestration
        run: python3 tests/gen_manifest.py --check

      - name: Set up Go for embedded beads
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"

      - name: Build pinned embedded-capable bd
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/beads"
          git -C "$RUNNER_TEMP/beads" remote add origin https://github.com/gastownhall/beads
          git -C "$RUNNER_TEMP/beads" fetch --depth 1 origin 22e91788612dfe46f9d3f2ca831aa1ced6602bb1
          git -C "$RUNNER_TEMP/beads" checkout --detach FETCH_HEAD
          cd "$RUNNER_TEMP/beads"
          CGO_ENABLED=1 go build -tags gms_pure_go -o "$RUNNER_TEMP/embedded-bd" ./cmd/bd
          echo "ATM_TEST_BD=$RUNNER_TEMP/embedded-bd" >> "$GITHUB_ENV"

      - name: Package tests
        working-directory: plugins/atm-bd-orchestration
        run: uv run --frozen --project ../../apps/atm-bd-console python -m pytest -q -rs

  atm-bd-types:
    name: atm-bd-types crate and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - name: Rust format, clippy, tests
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --features python -- -D warnings
          cargo test -p atm-bd-types
      - name: Wheel tests (reply bytes, stubs, pyright strict on the lite hooks)
        working-directory: crates/atm-bd-types
        run: |
          uv run --frozen --no-editable ruff check .
          uv run --frozen --no-editable pytest -q
