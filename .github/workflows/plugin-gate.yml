name: Plug-in hook gate

on:
  pull_request:
    paths:
      - 'plugins/atm-bd-orchestration/skills/*/scripts/**'
      - 'plugins/atm-bd-orchestration/skills/*/hooks/**'
      - 'plugins/atm-bd-orchestration/skills/*/profile.toml'
      - 'plugins/atm-bd-orchestration/core/gate/**'
      - 'tests/lite-gate-fixtures/**'
      - '.github/workflows/plugin-gate.yml'
  push:
    paths:
      - 'plugins/atm-bd-orchestration/skills/*/scripts/**'
      - 'plugins/atm-bd-orchestration/skills/*/hooks/**'
      - 'plugins/atm-bd-orchestration/skills/*/profile.toml'
      - 'plugins/atm-bd-orchestration/core/gate/**'
      - 'tests/lite-gate-fixtures/**'
      - '.github/workflows/plugin-gate.yml'

permissions:
  contents: read

jobs:
  hook-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v5
      - name: Test gate fixtures
        run: uv run --no-project --with pytest --with ./plugins/atm-bd-orchestration/core/gate/jev-check python -m pytest -q tests/lite-gate-fixtures/test_gate.py
      - name: Check each declared hook against its spec
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: uv run --no-project --with ./plugins/atm-bd-orchestration/core/gate/jev-check python plugins/atm-bd-orchestration/core/gate/run-plugin-gates.py
