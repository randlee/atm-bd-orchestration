# Repository-specific values rendered into the installed copy by install.py.
# Every value is read from the consuming repository at install time; none is
# stored in this package. `--set NAME=VALUE` overrides any of them.
variables:
  team:
    source: ".atm.toml [atm] default_team"
    required: true
    example: my-team
  lead:
    source: ".claude/agents/registry.yaml roles.lead"
    default: team-lead
  dev_sanity_member:
    source: ".claude/agents/registry.yaml roles.dev-sanity"
    required: true
    example: my-sanity
  bead_prefix:
    source: ".claude/agents/registry.yaml bead_prefix, else .beads/config.yaml issue-prefix"
    required: true
    example: myp
  workflow_issues_root:
    source: ".claude/agents/registry.yaml workflow_issues_root"
    default: "<bead_prefix>-workflow-issues"
  repo_slug:
    source: "git remote get-url origin, as owner/name"
    required: true
    example: owner/my-repo
  repo_name:
    source: "derived: last segment of repo_slug"
  repo_root:
    source: "derived: the repository path"
  worktree_base:
    source: "derived: ../<repo_name>-worktrees next to the repository"

