[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "atm-bd-types"
version = "0.19.12"
requires-python = ">=3.11"
description = "Shared types for ATM bead orchestration"
license = "MIT"

[tool.maturin]
features = ["python", "pyo3/extension-module"]
include = ["atm_bd_types.pyi"]
