[package]
name = "atm-bd-types"
version = "0.4.0"
edition = "2021"
description = "atm-bd framework contract: hook and monitor types, ATM hook wire"
publish = false

[lib]
# rlib for Rust users and tests; cdylib is the Python extension maturin builds with `--features python`.
crate-type = ["rlib", "cdylib"]

[features]
# The pyo3 bindings behind the `atm_bd_types` wheel (maturin enables it; plain `cargo test` does not link Python).
python = ["dep:pyo3"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pyo3 = { version = "0.30.1", features = ["abi3-py311"], optional = true }

[dev-dependencies]
toml = "0.8"
