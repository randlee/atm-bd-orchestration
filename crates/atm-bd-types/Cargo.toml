[package]
name = "atm-bd-types"
version = "0.19.12"
edition = "2024"
description = "Shared types for ATM bead orchestration"
license = "MIT"
repository = "https://github.com/randlee/atm-bd-orchestration"

[lib]
name = "atm_bd_types"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3", "dep:pyo3-stub-gen"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pyo3 = { version = "0.29", features = ["abi3-py311"], optional = true }
pyo3-stub-gen = { version = "0.23.2", default-features = false, optional = true }

[[bin]]
name = "stub_gen"
required-features = ["python"]
