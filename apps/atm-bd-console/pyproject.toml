[project]
name = "atm-bd"
version = "0.19.17"
description = "ATM and Beads orchestration console, cron runner, and bundled skills"
readme = "README.md"
license = "MIT"
authors = [{ name = "Rand Lee" }]
# Python 3.11 is the host python the installer requires (sc-compose 1.8.0 ships cp39-abi3 wheels; 1.7.0 was cp311-only, https://github.com/randlee/sc-compose/issues/819)
requires-python = ">=3.11,<3.12"
dependencies = ["rich>=15.0.0,<16", "textual>=8.2.8,<9", "sc-observability>=1.5.0,<2", "pyyaml", "pydantic", "sc-compose>=1.8.0,<2", "sc-sha>=1.7.0,<2"]

[project.optional-dependencies]
# The framework the profile (lite) monitor tick runs on. Not on PyPI until the lite profile release; a profile phase
# without it stops with a named error (monitor.route). Install from a checkout: uv tool install './apps/atm-bd-console[lite]'
lite = ["atm-bd-types", "atm-bd-core"]

[project.urls]
Repository = "https://github.com/randlee/atm-bd-orchestration"
Issues = "https://github.com/randlee/atm-bd-orchestration/issues"

[project.scripts]
atm-bd = "atm_bd_console.cli:main"

[dependency-groups]
dev = ["pytest", "ruff", "pyright", "hatchling==1.31.0", "atm-bd-types", "atm-bd-core"]

[build-system]
requires = ["hatchling==1.31.0", "sc-sha>=1.7.0,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atm_bd_console"]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist.hooks.custom]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.uv.sources]
atm-bd-types = { path = "../../crates/atm-bd-types", editable = true }
atm-bd-core = { path = "../../plugins/atm-bd-orchestration/core", editable = true }
bd-cache-rs = { git = "https://github.com/randlee/beads-cache", rev = "f57859f5c01fa463eb57ef11679e00118532c993", subdirectory = "crates/bd-cache-py" }
